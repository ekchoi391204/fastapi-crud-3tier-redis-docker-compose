services:
  db-svc:
    image: hifrodo/crud2-sql:1.0
    build:
      context: ./db
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-frodo}
      MYSQL_USER: ${MYSQL_USER:-frodo}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-Frodo5020!!}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "${MYSQL_EXPOSED_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis-svc:
    image: hifrodo/crud2-redis:1.0
    build:
      context: ./redis
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api-svc:
    image: hifrodo/crud2-api:1.0
    build:
      context: .
      dockerfile: app/Dockerfile
    restart: unless-stopped
    depends_on:
      db-svc:
        condition: service_healthy
      redis-svc:
        condition: service_healthy
    environment:
      MYSQL_HOST: ${MYSQL_HOST:-db-svc}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-frodo}
      MYSQL_USER: ${MYSQL_USER:-frodo}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-Frodo5020!!}
      REDIS_HOST: ${REDIS_HOST:-redis-svc}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_DATABASE: ${REDIS_DATABASE:-0}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_SESSION_PREFIX: ${REDIS_SESSION_PREFIX:-crud:session:}
      SERVER_IP: ${SERVER_IP:-}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8080}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-frodo1234}
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  front-svc:
    image: hifrodo/crud2-front:1.0
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      api-svc:
        condition: service_healthy
    ports:
      - "${FRONT_PORT:-8080}:80"

volumes:
  mysql_data:
  redis_data:
